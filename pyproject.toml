[project]
name = "ghcp-sdk-examples"
version = "0.1.0"
description = "Runnable Python examples for the Microsoft Copilot SDK (formerly GitHub Copilot SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "microsoft-copilot-sdk==2.0.1",
    "pydantic>=2.11",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
warn_unused_configs = true
ignore_missing_imports = true
